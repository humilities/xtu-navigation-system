<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>XTU校园导航与动态地图</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: 'Microsoft YaHei', sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }

        /* 顶部工具栏 */
        .top-bar {
            position: absolute; top: 15px; left: 15px; z-index: 5;
            display: flex; gap: 10px; align-items: flex-start;
        }
        .search-box {
            background: white; padding: 5px; border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2); display: flex;
        }
        .search-box input { border: none; padding: 10px; width: 220px; outline: none; }
        .search-box button { background: #3bb2d0; color: white; border: none; padding: 0 15px; border-radius: 5px; cursor: pointer; }

        /* 导航面板优化 */
        .nav-panel {
            background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            display: none; flex-direction: column; gap: 10px; width: 200px;
        }
        .nav-panel input { padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; }
        .nav-panel label { font-size: 12px; color: #666; margin-bottom: -5px; }

        /* 侧边栏 */
        .sidebar {
            position: absolute; top: 0; right: -400px; width: 380px; height: 100%;
            background: white; box-shadow: -2px 0 10px rgba(0,0,0,0.1);
            z-index: 10; transition: right 0.3s ease; overflow-y: auto; padding: 20px; box-sizing: border-box;
        }
        .sidebar.active { right: 0; }
        .close-btn { position: absolute; top: 15px; right: 15px; font-size: 24px; cursor: pointer; border: none; background: none; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn-nav-set { flex: 1; padding: 8px; border: 1px solid #2ecc71; background: white; color: #2ecc71; cursor: pointer; border-radius: 4px; font-size: 12px; }
        .btn-nav-set:hover { background: #2ecc71; color: white; }

        .photo-gallery img { width: 100%; border-radius: 8px; margin-top: 10px; }
        .lost-found-card { background: #fff3cd; border-left: 5px solid #ffc107; padding: 10px; margin: 10px 0; font-size: 13px; }
        .btn-action { width: 100%; padding: 10px; margin-top: 10px; border: 1px solid #3bb2d0; background: white; color: #3bb2d0; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="top-bar">
        <div class="search-box">
            <input type="text" id="kw" placeholder="输入地点名称 (如：图书馆)">
            <button onclick="handleSearch()">搜索</button>
        </div>
        <button onclick="toggleNavPanel()" style="background:white; border:none; padding:10px; border-radius:8px; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,0.2)">🧭 路径规划</button>
        
        <div id="nav-panel" class="nav-panel">
            <label>起点</label>
            <input type="text" id="start-name" placeholder="请输入起点名称">
            <label>终点</label>
            <input type="text" id="end-name" placeholder="请输入终点名称">
            <button onclick="getRoute()" style="background:#2ecc71; color:white; border:none; padding:10px; border-radius:4px; cursor:pointer; font-weight:bold;">开始导航</button>
        </div>
    </div>

    <div id="sidebar" class="sidebar">
        <button class="close-btn" onclick="closeSidebar()">×</button>
        <div id="side-content">
            <h2 id="title">地点名称</h2>
            <div class="btn-group">
                <button class="btn-nav-set" onclick="setAsNavPoint('start')">📍 设为起点</button>
                <button class="btn-nav-set" onclick="setAsNavPoint('end')">🏁 设为终点</button>
            </div>
            <p id="desc" style="color: #666; font-size: 14px; margin-top: 15px;"></p>
            <div id="photos" class="photo-gallery"></div>
            <hr>
            <h4>📢 校园动态</h4>
            <div id="lost-found"></div>
            <button class="btn-action" onclick="alert('评价功能开发中')">✍️ 我要评价</button>
            <hr>
            <h4>学生评价</h4>
            <div id="reviews"></div>
        </div>
    </div>

    <script>
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://api.maptiler.com/maps/streets/style.json?key=olZ4jftvJ5YGC8IM7Sno', 
            center: [112.857, 27.882],
            zoom: 16
        });

        const API_BASE = 'http://localhost:3000';
        let currentSelectedLocation = null;

        function closeSidebar() { document.getElementById('sidebar').classList.remove('active'); }
        function toggleNavPanel() { 
            const p = document.getElementById('nav-panel');
            p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
        }

        // 辅助函数：通过名称获取地点ID
        async function getLocationIdByName(name) {
            const res = await fetch(`${API_BASE}/api/locations/search?keyword=${encodeURIComponent(name)}`);
            const data = await res.json();
            return data.length > 0 ? data[0].id : null;
        }

        // 将当前点击的地点设为导航点
        function setAsNavPoint(type) {
            if (!currentSelectedLocation) return;
            document.getElementById(`${type}-name`).value = currentSelectedLocation.name;
            document.getElementById('nav-panel').style.display = 'flex';
        }

        // --- 1. 搜索功能修复 ---
        async function handleSearch() {
            const kw = document.getElementById('kw').value;
            if (!kw) return alert('请输入搜索关键词');
            
            try {
                const res = await fetch(`${API_BASE}/api/locations/search?keyword=${encodeURIComponent(kw)}`);
                const data = await res.json();
                if (data && data.length > 0) {
                    const target = data[0];
                    map.flyTo({ center: [target.longitude || target.lng, target.latitude || target.lat], zoom: 18 });
                    showLocationDetail(target.id);
                } else {
                    alert('未找到相关地点');
                }
            } catch (err) {
                console.error('搜索出错:', err);
            }
        }

        // --- 2. 显示详情 ---
        async function showLocationDetail(id) {
            try {
                const res = await fetch(`${API_BASE}/api/locations/${id}`);
                const data = await res.json();
                currentSelectedLocation = data; // 记录当前选中的地点
                
                document.getElementById('title').innerText = data.name;
                document.getElementById('desc').innerText = data.description || '暂无描述';
                
                const photoDiv = document.getElementById('photos');
                photoDiv.innerHTML = (data.photos || []).map(p => `<img src="${API_BASE}${p.url}">`).join('');

                const lfDiv = document.getElementById('lost-found');
                lfDiv.innerHTML = (data.lost_found || []).length > 0 ? 
                    data.lost_found.map(item => `<div class="lost-found-card"><b>[${item.type}]</b> ${item.item_name}</div>`).join('') : '<p style="font-size:12px;color:#999">暂无信息</p>';

                const revDiv = document.getElementById('reviews');
                revDiv.innerHTML = (data.reviews || []).map(r => `<div style="font-size:13px;margin-bottom:5px"><b>${r.user_nickname}:</b> ${r.comment}</div>`).join('');

                document.getElementById('sidebar').classList.add('active');
            } catch (err) {
                console.error('获取详情失败:', err);
            }
        }

        // --- 3. 路径规划 (名称转ID) ---
        async function getRoute() {
            const startName = document.getElementById('start-name').value;
            const endName = document.getElementById('end-name').value;
            
            if (!startName || !endName) return alert('请输入起点和终点名称');

            const startId = await getLocationIdByName(startName);
            const endId = await getLocationIdByName(endName);

            if (!startId || !endId) return alert('无法识别地点名称，请尝试搜索确认地点名');

            try {
                const res = await fetch(`${API_BASE}/api/navigation/route?start=${startId}&end=${endId}`);
                const data = await res.json();

                if (map.getLayer('route')) {
                    map.removeLayer('route');
                    map.removeSource('route');
                }

                map.addSource('route', {
                    'type': 'geojson',
                    'data': {
                        'type': 'Feature',
                        'geometry': { 'type': 'LineString', 'coordinates': data.coordinates }
                    }
                });

                map.addLayer({
                    'id': 'route', 'type': 'line', 'source': 'route',
                    'layout': { 'line-join': 'round', 'line-cap': 'round' },
                    'paint': { 'line-color': '#2ecc71', 'line-width': 6, 'line-opacity': 0.8 }
                });

                const bounds = data.coordinates.reduce((acc, coord) => acc.extend(coord), new maplibregl.LngLatBounds(data.coordinates[0], data.coordinates[0]));
                map.fitBounds(bounds, { padding: 50 });
            } catch (err) {
                alert('路径规划失败，请检查后端服务');
            }
        }

        // 初始化加载点位
        map.on('load', async () => {
            const res = await fetch(`${API_BASE}/api/map/buildings`);
            const buildings = await res.json();
            buildings.forEach(b => {
                const el = document.createElement('div');
                el.className = 'custom-marker';
                el.style.width = '12px'; el.style.height = '12px'; el.style.backgroundColor = '#ef4c4c';
                el.style.borderRadius = '50%'; el.style.cursor = 'pointer'; el.style.border = '2px solid white';

                new maplibregl.Marker(el)
                    .setLngLat([b.longitude, b.latitude])
                    .addTo(map);
                
                el.addEventListener('click', () => showLocationDetail(b.id));
            });
        });
    </script>
</body>
</html>
